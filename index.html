<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Que país é este? by Prof. Felippe</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&family=Public+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Atlas: neutros azulados, azul-marinho de acento, âmbar só para destaques. Layout: cartões sobre fundo pontilhado, tela inicial em duas colunas. */
:root{--bg:#f3f6fb;--card:#fff;--fg:#0f1b2d;--mut:#586880;--bd:#d9e1ec;--ink:#0f1b2d;--yl:#f4b942;--m:#2563eb;--f:#e8730c;--ac:#12407a;--acfg:#fff;--ok:#0f7a4d;--okbg:#e2f5ec;--bad:#b42336;--badbg:#fdeaed;--soft:#eaf0f8;--sans:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--serif:"Newsreader",Georgia,"Times New Roman",serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1120;--card:#111a2d;--fg:#e8eef8;--mut:#98a8c0;--bd:#24324b;--ink:#5b6c8a;--yl:#f4b942;--m:#5b9bff;--f:#ff9d57;--ac:#2f6fe0;--acfg:#fff;--ok:#4fd8a0;--okbg:#0f2e25;--bad:#ff8c99;--badbg:#3a1822;--soft:#16213a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1120;--card:#111a2d;--fg:#e8eef8;--mut:#98a8c0;--bd:#24324b;--ink:#5b6c8a;--yl:#f4b942;--m:#5b9bff;--f:#ff9d57;--ac:#2f6fe0;--acfg:#fff;--ok:#4fd8a0;--okbg:#0f2e25;--bad:#ff8c99;--badbg:#3a1822;--soft:#16213a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.5 var(--sans);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background-image:radial-gradient(900px 380px at 50% -120px,color-mix(in srgb,var(--m) 14%,transparent),transparent),radial-gradient(color-mix(in srgb,var(--bd) 70%,transparent) 1px,transparent 1px);background-size:auto,26px 26px;background-repeat:no-repeat,repeat;min-height:100vh}
html{background:var(--bg)}
main{max-width:1040px;margin:0 auto;padding-block:20px 28px}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-.015em;text-wrap:balance;margin:0}
p{margin:0 0 10px}
button{font:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.mut{color:var(--mut)}
.num{font-variant-numeric:tabular-nums}
svg{display:block;width:100%;height:auto}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;font-size:15px}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;color:var(--mut)}
.brand::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--yl);box-shadow:0 0 0 3px color-mix(in srgb,var(--yl) 30%,transparent)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:20px;box-shadow:0 1px 2px rgba(10,20,40,.05),0 14px 34px rgba(10,20,40,.08)}
.btn{border:0;border-radius:12px;padding:12px 20px;font-weight:700;background:var(--ac);color:var(--acfg);box-shadow:0 6px 16px rgba(18,64,122,.25);transition:transform .12s,filter .12s}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn:active{transform:none}
.btn.alt{background:var(--card);color:var(--ac);border:1.5px solid var(--bd);box-shadow:none}
.btn.sm{padding:8px 14px;font-size:15px;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:default;transform:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 12px;border:1px solid var(--bd);border-radius:999px;background:var(--card);color:var(--fg);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.pill.yl{background:var(--yl);color:#1b1440;border-color:transparent;margin-left:auto}
.tmb.on{background:var(--yl);color:#1b1440;border-color:transparent}
.tmb.low{background:var(--bad);color:#fff;border-color:transparent}
/* tela inicial */
.home{display:grid;grid-template-columns:1.15fr 1fr;gap:28px;align-items:stretch}
.hero{display:flex;flex-direction:column;gap:14px;padding:30px}
.hero h1{font-size:clamp(2.6rem,6.2vw,4.4rem);line-height:1.02;font-weight:600;font-optical-sizing:auto}
.lede{font-size:19px;line-height:1.5;max-width:30em;margin:0}
.by{color:var(--mut);font-size:15px;margin:0}
.guide{margin-top:auto;padding-top:18px;border-top:1px solid var(--bd)}
.guide h2{font-size:1.1rem;margin-bottom:10px;font-weight:600}
.minis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mini{text-align:center;font-size:13px;line-height:1.25;color:var(--mut)}
.mini svg{margin-bottom:4px;background:var(--soft);border-radius:8px}
.mini b{display:block;color:var(--fg);font-size:14px}
.panel{display:flex;flex-direction:column;gap:12px}
.panel h2{font-size:1.35rem;font-weight:600}
.lvls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lvl{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:0;border-radius:14px;padding:16px;color:#fff;font-weight:700;font-size:20px;font-family:var(--serif);box-shadow:0 8px 20px rgba(10,20,40,.18);transition:transform .12s}
.lvl small{font-family:var(--sans);font-size:13px;font-weight:500;opacity:.92}
.lvl:hover{transform:translateY(-2px)}
.lvl.easy{background:linear-gradient(135deg,#0f7a4d,#17a068)}
.lvl.hard{background:linear-gradient(135deg,#a8231f,#d9560c)}
.modes{display:flex;flex-direction:column;border:1px solid var(--bd);border-radius:14px;overflow:hidden;background:var(--card)}
.mode{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--bd);padding:14px 16px;color:var(--fg)}
.mode:first-child{border-top:0}
.mode:hover{background:var(--soft)}
.mode b{display:block;font-family:var(--serif);font-size:1.15rem;font-weight:600}
.mode span.d{display:block;font-size:14px;color:var(--mut)}
.mode .chev{flex:none;color:var(--mut);font-size:22px;line-height:1}
.mode .tag{flex:none;font-size:13px;font-weight:700;color:var(--ac);background:var(--soft);border-radius:999px;padding:2px 10px}
.toggle{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--mut)}
/* jogo */
.top{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.bar{height:8px;border-radius:999px;background:var(--bd);margin-bottom:14px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--m),var(--f));transition:width .4s}
.q{font-family:var(--serif);font-weight:600;font-size:1.45rem;margin-bottom:10px;line-height:1.2}
.play{display:grid;grid-template-columns:1.1fr 1fr;gap:6px 28px;align-items:start}
.play .q{grid-column:1/-1}
.pl,.pr{min-width:0}
.chart{background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:4px}
.chart text{font-family:var(--sans)}
.legend{font-size:14px;color:var(--mut);margin:6px 0 0}
.hintbtn{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;margin-bottom:10px;border:1px solid color-mix(in srgb,var(--yl) 65%,#000);border-radius:999px;background:color-mix(in srgb,var(--yl) 20%,var(--card));color:var(--fg);font-weight:700}
.hintbtn small{background:var(--yl);color:#1b1440;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:800}
.hint:empty{display:none}
.hint{background:color-mix(in srgb,var(--yl) 20%,var(--card));border:1px solid color-mix(in srgb,var(--yl) 60%,transparent);border-radius:12px;padding:10px 14px;margin-bottom:14px;line-height:1.55}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;counter-reset:o}
.opt{min-width:0;overflow-wrap:anywhere;display:flex;align-items:center;gap:10px;text-align:left;padding:14px 10px;background:var(--card);color:var(--fg);border:1.5px solid var(--bd);border-radius:14px;font-weight:700;font-size:19px;box-shadow:0 1px 2px rgba(10,20,40,.05)}
.opt::before{counter-increment:o;content:counter(o);flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--bg);border:1px solid var(--bd);font-size:13px;color:var(--mut)}
.opt:hover:not(:disabled){border-color:var(--ac);transform:translateY(-1px);box-shadow:0 8px 20px rgba(10,20,40,.12)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--okbg);box-shadow:0 0 0 3px var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg);box-shadow:0 0 0 3px var(--badbg)}
.fl{font-size:28px;line-height:1}
.fb{margin-top:14px;padding:14px;border:1px solid;border-left-width:4px;border-radius:14px;animation:pop .3s ease-out both}
.fb.okb{background:var(--okbg);border-color:var(--ok)}
.fb.badb{background:var(--badbg);border-color:var(--bad)}
.fhd{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.bigfl{font-size:48px;line-height:1}
.fhd strong{font-family:var(--serif);font-size:1.3rem;font-weight:600}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0;text-align:center}
.st>div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:6px 2px}
.st b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.st span{font-size:13px;color:var(--mut)}
.rec{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 16px;justify-content:center}
.chip{font-size:14px;padding:3px 10px;border-radius:12px;border:1px solid;font-weight:600}
.chip.ok{color:var(--ok);background:var(--okbg)}
.chip.bad{color:var(--bad);background:var(--badbg)}
.center{text-align:center}
.stamp{display:inline-block;border:2px dashed var(--bad);color:var(--bad);border-radius:12px;padding:6px 16px;font-weight:800;font-size:19px;text-transform:uppercase;letter-spacing:.06em;transform:rotate(-3deg);margin:4px 0 12px}
.nmrow{display:flex;gap:8px;margin:12px 0}
input[type=text],select{font:inherit;padding:10px 12px;border:1.5px solid var(--bd);border-radius:12px;background:var(--card);color:var(--fg)}
.nmrow input{flex:1;min-width:0}
#lb{text-align:left;margin:8px 0 14px}
#lb h2{font-size:1.2rem;margin-bottom:6px}
#lb ol{margin:0;padding-left:26px}
#lb li{padding:4px 0}
#lb li span{float:right;color:var(--mut);font-size:15px}
#lb li.me{background:var(--yl);color:#1b1440;border-radius:8px;padding:4px 8px}
#lb li.me span{color:#1b1440}
/* selos */
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.sl{border:1px solid var(--bd);border-radius:14px;padding:12px;text-align:center;background:var(--card)}
.sl svg{width:64px;height:64px;margin:0 auto 6px}
.sl b{display:block;font-family:var(--serif);font-size:1.05rem}
.sl small{display:block;color:var(--mut);font-size:13px;line-height:1.3}
.sl .pg{height:6px;border-radius:99px;background:var(--bd);margin-top:8px;overflow:hidden}
.sl .pg i{display:block;height:100%;background:var(--ac)}
.sl.lock svg{opacity:.35}
.sl.new{border-color:var(--yl);box-shadow:0 0 0 3px color-mix(in srgb,var(--yl) 40%,transparent)}
.newst{margin:10px 0;text-align:left}
/* modo aula */
.cls .q{font-size:clamp(1.3rem,2.4vw,2rem)}
.cgrid{display:grid;grid-template-columns:1.2fr 1fr;gap:24px;align-items:start}
.cgrid .chart svg{max-height:62vh;margin:0 auto}
.copts{display:flex;flex-direction:column;gap:10px}
.co{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border:2px solid var(--bd);border-radius:16px;background:var(--card);position:relative;overflow:hidden}
.co .ltr{display:grid;place-items:center;width:40px;height:40px;border-radius:10px;background:var(--soft);font-weight:800;font-size:20px}
.co .nm{font-weight:700;font-size:clamp(1.15rem,2.2vw,1.7rem)}
.co .vt{display:flex;align-items:center;gap:6px}
.co .vt button{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--bd);background:var(--card);color:var(--fg);font-size:22px;line-height:1}
.co .cnt{min-width:2ch;text-align:center;font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.co .vb{position:absolute;left:0;bottom:0;height:5px;background:var(--m);transition:width .3s}
.co.ok{border-color:var(--ok);background:var(--okbg)}
.co.dim{opacity:.55}
.ctl{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;align-items:center}
.keys{font-size:13px;color:var(--mut);margin-top:12px}
.seg{display:inline-flex;border:1.5px solid var(--bd);border-radius:12px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--fg);padding:8px 16px;font-weight:700}
.seg button[aria-pressed=true]{background:var(--ac);color:var(--acfg)}
/* laboratorio */
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{border:1.5px solid var(--bd);background:var(--card);color:var(--fg);border-radius:999px;padding:8px 18px;font-weight:700}
.tabs button[aria-selected=true]{background:var(--ac);color:var(--acfg);border-color:var(--ac)}
.lab{display:grid;grid-template-columns:1.1fr 1fr;gap:24px;align-items:start}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}
.facts div{background:var(--soft);border-radius:12px;padding:8px 12px}
.facts b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.facts span{font-size:13px;color:var(--mut)}
.chart.drag{cursor:ew-resize;touch-action:none}
details.fine{margin-top:12px}
details.fine summary{cursor:pointer;font-weight:700}
.sliders{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 16px;margin-top:8px}
.sliders label{display:grid;grid-template-columns:54px 1fr;align-items:center;gap:6px;font-size:13px;color:var(--mut)}
input[type=range]{width:100%;accent-color:var(--ac)}
.score{font-family:var(--serif);font-size:2.6rem;font-weight:600;line-height:1}
.tl-ctl{display:flex;gap:10px;align-items:center;margin:8px 0}
.tl-ctl input[type=range]{flex:1}
.yr{font-family:var(--serif);font-size:2.4rem;font-weight:600;line-height:1}
.note{font-size:13px;color:var(--mut);margin-top:16px;line-height:1.45}
.cf{position:fixed;top:-20px;width:9px;height:13px;border-radius:2px;pointer-events:none;animation:fall 1.6s ease-in both}
@keyframes fall{to{transform:translateY(110vh) rotate(600deg)}}
@keyframes pop{from{transform:scale(.96);opacity:0}}
@keyframes grow{from{transform:scaleX(0)}}
.b{transform-box:fill-box;animation:grow .5s cubic-bezier(.2,.8,.2,1) both}
.bl{transform-origin:right center}
.br{transform-origin:left center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:860px){.home,.play,.cgrid,.lab{grid-template-columns:1fr}.hero{padding:22px}}
@media (max-width:600px){body{font-size:16px}main{padding-block:12px 20px}.card{padding:14px;border-radius:14px}.opt{font-size:17px;padding:12px 8px}.fl{font-size:24px}.pill{font-size:13px;padding:1px 10px}.q{font-size:1.25rem}.chart svg{max-height:52vh}.nmrow{flex-direction:column}.sliders{grid-template-columns:1fr}.lede{font-size:17px}.minis{gap:6px}.lvl{font-size:18px;padding:14px}}
@media (max-width:380px){.opts{grid-template-columns:1fr}.lvls{grid-template-columns:1fr}}

</style>
</head>

const GEO={L:150,cx:200,top:24,h:15};
function chart(m,w,opt={}){
  const{L,cx,top,h}=GEO,ov=opt.ov,all=[...m,...w,...(ov?[...ov.m,...ov.w]:[])];
  const mx=opt.mx||Math.max(2,Math.ceil(Math.max(...all)/2)*2),base=top+17*h;
  let s=`<svg class="chart${opt.drag?' drag':''}" ${opt.id?`id="${opt.id}" `:''}viewBox="0 0 400 300" role="img" aria-label="Pirâmide etária: homens à esquerda, mulheres à direita, de 0 a 80 anos ou mais">`;
  [0,.5,1].forEach(t=>{
    const xl=cx-17-L*t,xr=cx+17+L*t,lb=(mx*t)+'%';
    s+=`<line x1="${xl}" x2="${xl}" y1="${top}" y2="${base}" stroke="var(--bd)"/><line x1="${xr}" x2="${xr}" y1="${top}" y2="${base}" stroke="var(--bd)"/>`;
    if(opt.ax){s+=`<text x="${xl}" y="${base+14}" text-anchor="middle" font-size="11" fill="var(--mut)">${lb}</text>`;if(t>0)s+=`<text x="${xr}" y="${base+14}" text-anchor="middle" font-size="11" fill="var(--mut)">${lb}</text>`}
  });
  s+=`<text x="${cx-20}" y="14" text-anchor="end" font-size="13" font-weight="700" fill="var(--m)">Homens</text><text x="${cx+20}" y="14" font-size="13" font-weight="700" fill="var(--f)">Mulheres</text>`;
  for(let i=0;i<17;i++){
    const y=top+(16-i)*h,wm=Math.min(m[i],mx)/mx*L,wf=Math.min(w[i],mx)/mx*L,dl=opt.anim===false?'':`style="animation-delay:${i*35}ms"`;
    s+=`<rect class="${opt.anim===false?'':'b '}bl" ${dl} x="${cx-17-wm}" y="${y}" width="${wm}" height="${h-2}" rx="2" fill="var(--m)"/><rect class="${opt.anim===false?'':'b '}br" ${dl} x="${cx+17}" y="${y}" width="${wf}" height="${h-2}" rx="2" fill="var(--f)"/><text x="${cx}" y="${y+h-4}" text-anchor="middle" font-size="11" fill="var(--mut)">${AG[i]}</text>`;
  }
  if(ov)for(const[arr,sg]of[[ov.m,-1],[ov.w,1]]){
    const x=i=>cx+sg*(17+Math.min(arr[i],mx)/mx*L),yb=i=>top+(17-i)*h-1;
    let d=`M${cx+sg*17},${yb(0)}`;
    for(let i=0;i<17;i++)d+=` H${x(i)} V${yb(i)-h}`;
    d+=` H${cx+sg*17}`;
    s+=`<path d="${d}" fill="none" stroke="var(--fg)" stroke-width="1.8" stroke-dasharray="4 3" stroke-linejoin="round"/>`;
  }
  return s+'</svg>';
}

function mini(c){

/* opções: modo f (4 tipos distintos), d (6 parecidas), c (4 para a aula) */
function opts(c,mode){
  let rest=shuf(C.filter(x=>x!==c));
  if(c.n==='Uganda')rest=rest.filter(x=>x.n!=='Quênia');
  if(c.n==='Quênia')rest=rest.filter(x=>x.n!=='Uganda');
  const pick=[];
  if(mode==='d'){rest.sort((a,b)=>(b.t===c.t)-(a.t===c.t));pick.push(...rest.slice(0,5))}
  else if(mode==='c'){const same=rest.filter(x=>x.t===c.t).slice(0,2),oth=rest.filter(x=>x.t!==c.t);pick.push(...same,...oth.slice(0,3-same.length))}
  else{const u=new Set([c.t]);rest.forEach(x=>{if(pick.length<3&&!u.has(x.t)){u.add(x.t);pick.push(x)}})}
  return shuf([c,...pick]);
}

  const c=G.q[G.i],ok=G.o[k]===c,p=ok?(G.hint?5:10):0;
  G.s+=p;G.h.push(ok);G.st=ok?G.st+1:0;G.best=Math.max(G.best,G.st);
  if(ok){PS.ty[c.t]++;c.cont.forEach(x=>PS.co[x]=1);boom()}
  PS.streak=Math.max(PS.streak||0,G.best);psSave(PS);
  $('#pts').textContent=G.s+' pontos';paintTM();
  document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(G.o[j]===c)b.classList.add('ok');else if(j===k)b.classList.add('bad')});
  $('#hint').innerHTML='';$('#hb')?.remove();
  let lg='';
  if(!ok&&k>=0){const w=G.o[k];$('#chw').innerHTML=chartOf(c,{ax:true,ov:w,anim:false});lg=`<p class="legend">Barras: ${c.n}. Contorno tracejado: ${w.n}, a sua escolha.</p>`}
  else $('#chw').innerHTML=chartOf(c,{ax:true,anim:false});
  const msg=ok?['Mandou bem!','Isso aí!','Acertou em cheio!','Craque da geografia!'][Math.floor(Math.random()*4)]+' +'+p+' pontos':(k<0?'Tempo esgotado! A resposta era ':'Quase! A resposta era ')+c.n+'.';
  $('#fb').innerHTML=`${lg}<div class="fb ${ok?'okb':'badb'}"><div class="fhd"><span class="bigfl">${c.fl}</span><strong>${msg}</strong></div><p>${TS[c.t]}.</p>
  <div class="st"><div><b>${f1(c.y)}%</b><span>0 a 14 anos</span></div><div><b>${f1(c.a)}%</b><span>15 a 64 anos</span></div><div><b>${f1(c.o)}%</b><span>65 anos ou mais</span></div></div>
  <p>${c.f}</p><button class="btn" onclick="next()">${G.i<9?'Próxima rodada':'Ver resultado'}</button></div>`;
  $('#fb .btn').focus();
}
function next(){G.i++;G.i<10?round():end()}
const LBK='piramides-ranking';
function lbGet(){try{return JSON.parse(localStorage.getItem(LBK))||[]}catch(e){return[]}}
function lbSave(){
  if(G.saved)return;G.saved=true;G.d=Date.now();
  const n=($('#nm').value||'').trim().slice(0,16)||'Anônimo',l=lbGet();
  l.push({n,s:G.s,lv:G.lv,tm:TM,d:G.d});l.sort((a,b)=>b.s-a.s||a.d-b.d);
  try{localStorage.setItem(LBK,JSON.stringify(l.slice(0,10)))}catch(e){}
  $('.nmrow').style.display='none';showLB();
}
function showLB(){
  const l=lbGet();
  $('#lb').innerHTML=l.length?'<h2>Ranking deste aparelho</h2><ol>'+l.map(r=>`<li${r.d===G.d?' class="me"':''}><b>${esc(r.n)}</b><span>${r.s} pts, ${r.lv==='d'?'Difícil':'Fácil'}${r.tm?', com cronômetro':''}</span></li>`).join('')+'</ol>':'';
}
function end(){
  stopTimers();const s=G.s,hits=G.h.filter(Boolean).length;
  PS.games++;if(hits===10)PS.perfect++;if(G.lv==='d'&&s>=80)PS.hard80++;PS.best=Math.max(PS.best,s);
  const nw=unlockCheck();psSave(PS);
  const m=s>=80?'Excelente leitura de pirâmides etárias!':s>=50?'Bom resultado. Compare as formas das pirâmides para afinar o olhar.':'Vale rever os quatro tipos de pirâmide e jogar de novo.';
  app.innerHTML=`${topbar()}<section class="card center" style="max-width:720px;margin:0 auto"><h1 style="font-size:2.4rem">${s} de 100 pontos</h1><div class="stamp">${s>=80?'Mestre dos Censos':s>=60?'Explorador(a)':s>=40?'Viajante':'Turista'}</div><p class="mut">Nível ${G.lv==='d'?'difícil':'fácil'}. ${m}</p>
  <div class="rec">${G.q.map((c,i)=>`<span class="chip ${G.h[i]?'ok':'bad'}">${G.h[i]?'✓':'✗'} ${c.fl} ${c.n}</span>`).join('')}</div>
  ${nw.length?`<div class="newst"><h2 style="font-size:1.3rem;margin-bottom:8px">Selos novos</h2><div class="stamps">${nw.map(x=>stampCard(x,true)).join('')}</div></div>`:''}
  <div class="nmrow"><input type="text" id="nm" maxlength="16" placeholder="Seu nome" aria-label="Seu nome"><button class="btn" onclick="lbSave()">Salvar no ranking</button></div><div id="lb"></div>
  <div class="row" style="justify-content:center"><button class="btn" onclick="play(G.lv)">Jogar de novo</button><button class="btn alt" onclick="home()">Início</button><button class="btn alt" onclick="passport()">Passaporte</button></div></section>${note()}`;
  showLB();
}
document.addEventListener('keydown',e=>{
  if(e.target.matches&&e.target.matches('input,select,textarea'))return;
  const n=+e.key;
  if(CL&&CL.on){classKey(e);return}
  if(n>=1&&G&&G.o&&n<=G.o.length&&!G.done&&$('.opt'))pick(n-1);
});

/* ===== Modo aula ===== */
function classSetup(){
  stopTimers();CL={on:false,n:10};
  app.innerHTML=`${topbar()}<section class="card" style="max-width:640px;margin:0 auto"><h1 style="font-size:2rem;margin-bottom:8px">Modo aula</h1>
  <p>Projete uma pirâmide por vez. A turma vota levantando a mão ou um cartão, você conta os votos, libera as pistas aos poucos e revela a resposta.</p>
  <p class="mut">Quantas pirâmides?</p><div class="seg" role="group" aria-label="Quantidade de pirâmides">${[5,10,15].map(n=>`<button aria-pressed="${n===10}" onclick="CL.n=${n};document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.textContent==${n}))">${n}</button>`).join('')}</div>
  <div class="row" style="margin-top:20px"><button class="btn" onclick="classStart()">Começar a aula</button></div>
  <p class="keys">Atalhos durante a aula: A a D (ou 1 a 4) somam um voto, Shift tira um voto, H libera a próxima pista, R revela, seta para a direita avança, F tela cheia, Esc sai.</p></section>`;
}
function classStart(){const n=CL.n;CL={on:true,n,i:0,q:shuf(C).slice(0,n),res:[]};classRound()}
function classRound(){
  const c=CL.q[CL.i];CL.o=opts(c,'c');CL.ovn='';CL.v=[0,0,0,0];CL.step=0;CL.rev=false;
  app.innerHTML=`<div class="cls"><div class="top"><span class="pill">Modo aula</span><span class="pill">Pirâmide ${CL.i+1} de ${CL.n}</span><span style="margin-left:auto" class="row"><button class="btn sm alt" id="fsb" onclick="toggleFS()">Tela cheia</button><button class="btn sm alt" onclick="home()">Sair</button></span></div>
  <section class="card"><p class="q">A qual país pertence esta pirâmide?</p><div class="cgrid"><div id="cch" class="chart-wrap"></div><div id="cside"></div></div></section></div>`;
  if(!document.fullscreenEnabled)$('#fsb').hidden=true;
  $('#cch').innerHTML=chartOf(c,{ax:true});paintClass();
}
function paintClass(){
  const c=CL.q[CL.i],tot=CL.v.reduce((a,b)=>a+b,0),L='ABCD';
  $('#cside').innerHTML=`<div class="copts">${CL.o.map((o,k)=>`<div class="co${CL.rev?(o===c?' ok':' dim'):''}"><span class="ltr">${L[k]}</span><span class="nm"><span class="fl">${o.fl}</span> ${o.n}</span><span class="vt">${CL.rev?'':`<button onclick="vote(${k},-1)" aria-label="Tirar um voto de ${L[k]}">−</button>`}<span class="cnt">${CL.v[k]}</span>${CL.rev?(tot?`<span class="mut num">${Math.round(CL.v[k]/tot*100)}%</span>`:''):`<button onclick="vote(${k},1)" aria-label="Somar um voto em ${L[k]}">+</button>`}</span><i class="vb" style="width:${tot?CL.v[k]/tot*100:0}%"></i></div>`).join('')}</div>
  <div class="hint" id="chint" style="margin-top:12px;font-size:1.05em">${hintLines(c).slice(0,CL.step).join('<br>')}</div>
  <div id="crev"></div>
  <div class="ctl"><button class="btn alt" onclick="classHint()" ${CL.step>=3||CL.rev?'disabled':''}>Pista (H)</button><button class="btn" onclick="classReveal()" ${CL.rev?'disabled':''}>Revelar (R)</button><button class="btn alt" onclick="classNext()" ${CL.rev?'':'disabled'}>${CL.i<CL.n-1?'Próxima (→)':'Resultado (→)'}</button></div>
  <p class="keys">A–D votam, Shift desfaz, H pista, R revela, → avança, F tela cheia.</p>`;
  if(CL.rev){
    const hit=tot?Math.round(CL.v[CL.o.indexOf(c)]/tot*100):null;
    $('#crev').innerHTML=`<div class="fb okb" style="margin-top:12px"><div class="fhd"><span class="bigfl">${c.fl}</span><strong>${c.n}</strong></div><p>${TS[c.t]}.</p><p>${c.f}</p>${hit===null?'':`<p><b>${hit}% da turma acertou.</b></p>`}${CL.ovn?`<p class="legend">Contorno tracejado: ${CL.ovn}, a opção errada mais votada.</p>`:''}</div>`;
  }
}
function vote(k,d){if(CL.rev)return;CL.v[k]=Math.max(0,CL.v[k]+d);paintClass()}
function classHint(){if(CL.rev||CL.step>=3)return;CL.step++;paintClass()}
function classReveal(){
  if(CL.rev)return;const c=CL.q[CL.i];CL.rev=true;CL.step=3;
  const tot=CL.v.reduce((a,b)=>a+b,0);
  CL.res.push({c,tot,hit:tot?CL.v[CL.o.indexOf(c)]/tot*100:null});
  let top=-1,tv=0;CL.o.forEach((o,k)=>{if(o!==c&&CL.v[k]>tv){tv=CL.v[k];top=k}});
  CL.ovn=top>=0?CL.o[top].n:'';
  $('#cch').innerHTML=chartOf(c,{ax:true,anim:false,ov:top>=0?CL.o[top]:null});
  paintClass();
}
function classNext(){if(!CL.rev)return;CL.i++;CL.i<CL.n?classRound():classEnd()}
function classEnd(){
  CL.on=false;const r=CL.res.filter(x=>x.hit!==null),avg=r.length?Math.round(r.reduce((a,x)=>a+x.hit,0)/r.length):null;
  app.innerHTML=`${topbar()}<section class="card" style="max-width:720px;margin:0 auto"><h1 style="font-size:2rem;margin-bottom:6px">Resultado da turma</h1>
  <p class="mut">${avg===null?'Nenhum voto foi registrado.':`Média de acertos da turma: ${avg}%.`}</p>
  <ol style="padding-left:24px">${CL.res.map(x=>`<li style="padding:4px 0"><b>${x.c.fl} ${x.c.n}</b> <span class="mut">${x.hit===null?'sem votos':Math.round(x.hit)+'% acertaram'}</span></li>`).join('')}</ol>
  <div class="row"><button class="btn" onclick="classSetup()">Nova aula</button><button class="btn alt" onclick="home()">Início</button></div></section>${note()}`;
}
function classKey(e){
  const k=e.key.toLowerCase();let h=true;
  if('abcd'.includes(k)&&k.length===1)vote('abcd'.indexOf(k),e.shiftKey?-1:1);
  else if('1234'.includes(k)&&k.length===1)vote(+k-1,e.shiftKey?-1:1);
  else if(k==='h')classHint();
  else if(k==='r')classReveal();
  else if(k==='arrowright'||k==='n'||k===' '||k==='enter'){if(CL.rev)classNext();else if(k===' '||k==='enter')CL.step<3?classHint():classReveal();}
  else if(k==='f')toggleFS();
  else if(k==='escape')home();
  else h=false;
  if(h)e.preventDefault();
}
function toggleFS(){try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}}
/* ===== Laboratório ===== */
let LB=null,TL=null;
function labHome(tab){
  stopTimers();CL=null;tab=tab||'b';
  app.innerHTML=`${topbar()}<section class="card"><h1 style="font-size:2rem;margin-bottom:10px">Laboratório</h1>
  <div class="tabs" role="tablist"><button role="tab" aria-selected="${tab==='b'}" onclick="labHome('b')">Monte a pirâmide</button><button role="tab" aria-selected="${tab==='t'}" onclick="labHome('t')">Linha do tempo</button></div><div id="labc"></div></section>${note()}`;
  tab==='b'?buildNew():timeline();
}
function buildNew(){
  const pool=C.filter(c=>c.t!==3),c=pool[Math.floor(Math.random()*pool.length)];
  LB={c,v:Array(17).fill(6),done:false,mx:10};buildPaint();
}
function bchart(){return chart(LB.v.map(x=>x/2),LB.v.map(x=>x/2),{ax:true,mx:LB.mx,anim:false,drag:true,id:'bsvg'})}
function buildPaint(){
  const c=LB.c;
  $('#labc').innerHTML=`<div class="lab"><div><div id="bw" class="chart-wrap">${bchart()}</div><p class="legend">Arraste sobre as barras para mudar o tamanho de cada faixa de idade.</p></div>
  <div><h2 style="font-size:1.4rem;margin-bottom:6px">Monte a pirâmide de um país misterioso</h2><p>Use as pistas e desenhe a pirâmide. Sua pirâmide é comparada com a real, e a nota é a parte que as duas têm em comum.</p>
  <div class="facts"><div><b>${Math.round(c.y)}%</b><span>têm menos de 15 anos</span></div><div><b>${Math.round(c.o)}%</b><span>têm 65 anos ou mais</span></div><div><b>${Math.round(c.md)} anos</b><span>idade mediana</span></div><div><b>${f1(c.tf)}</b><span>filhos por mulher</span></div></div>
  <p class="mut">Fica ${c.k}. ${esc(c.h)}</p>
  <div id="bres"></div>
  <div class="row"><button class="btn" id="bchk" onclick="buildCheck()">Conferir</button><button class="btn alt" onclick="buildNew()">Outro país</button></div>
  <details class="fine"><summary>Ajuste fino por faixa</summary><div class="sliders">${AG.map((a,i)=>`<label>${a}<input type="range" min="0" max="${LB.mx*2}" step="0.1" value="${LB.v[i]}" id="sl${i}" aria-label="Faixa ${a} anos" oninput="bset(${i},+this.value)"></label>`).join('')}</div></details></div></div>`;
  const w=$('#bw');let on=false;
  const at=e=>{
    const s=$('#bsvg');if(!s||LB.done)return;const r=s.getBoundingClientRect(),vx=(e.clientX-r.left)/r.width*400,vy=(e.clientY-r.top)/r.height*300,{L,cx,top,h}=GEO;
    const i=16-Math.floor((vy-top)/h);if(i<0||i>16)return;
    const sx=Math.max(0,Math.min(LB.mx,(Math.abs(vx-cx)-17)/L*LB.mx));
    LB.v[i]=Math.round(sx*2*10)/10;w.innerHTML=bchart();const r2=$('#sl'+i);if(r2)r2.value=LB.v[i];
  };
  w.addEventListener('pointerdown',e=>{on=true;try{w.setPointerCapture(e.pointerId)}catch(x){}at(e)});
  w.addEventListener('pointermove',e=>{if(on)at(e)});
  w.addEventListener('pointerup',()=>on=false);w.addEventListener('pointercancel',()=>on=false);
}
function bset(i,v){if(LB.done)return;LB.v[i]=v;$('#bw').innerHTML=bchart()}
function buildCheck(){
  if(LB.done)return;LB.done=true;const c=LB.c;
  const sv=sum(LB.v,0,17)||1,q=c.m.map((x,i)=>x+c.w[i]),qs=sum(q,0,17);
  const score=Math.round(q.reduce((a,x,i)=>a+Math.min(x/qs,LB.v[i]/sv),0)*100);
  const msg=score>=90?'Quase idêntica!':score>=80?'Muito boa. A forma geral está certa.':score>=65?'Boa tentativa. Compare as bases e os topos.':'Ainda longe. Observe o contorno e tente de novo com outro país.';
  $('#bw').innerHTML=chart(c.m,c.w,{ax:true,anim:false,ov:{m:LB.v.map(x=>x/2*(100/sv)*(qs/100)),w:LB.v.map(x=>x/2*(100/sv)*(qs/100))}});
  $('#bres').innerHTML=`<div class="fb okb" style="margin:8px 0 12px"><div class="fhd"><span class="bigfl">${c.fl}</span><strong>${c.n}</strong></div><div class="score num">${score}%</div><p>${msg}</p><p class="legend">Barras: pirâmide real. Contorno tracejado: a sua, ajustada ao mesmo total.</p></div>`;
  $('#bchk').disabled=true;
}
/* linha do tempo */
function framesOf(code){const d=DB.c[code];return d.f.map(f=>({m:f.slice(0,17).map(v=>v/100),w:f.slice(17).map(v=>v/100)}))}
function timeline(code){
  const cc=code||(TL&&TL.code)||76;
  const fr=framesOf(cc),mx=Math.max(2,Math.ceil(Math.max(...fr.flatMap(f=>[...f.m,...f.w]))/2)*2);
  TL={code:cc,fr,mx,i:YR.indexOf(2025),ghost:true,play:false};
  const opts=[...C].sort((a,b)=>a.n.localeCompare(b.n,'pt')).map(c=>`<option value="${c.code}" ${c.code==cc?'selected':''}>${c.fl} ${c.n}</option>`).join('');
  $('#labc').innerHTML=`<div class="lab"><div><div id="tch" class="chart-wrap"></div><p class="legend" id="tleg"></p></div><div>
  <div class="row" style="margin-bottom:8px"><label for="tsel" class="mut">País</label><select id="tsel" onchange="stopTimers();timeline(+this.value)">${opts}</select></div>
  <div class="yr num" id="tyr"></div><div class="mut" id="ttag"></div>
  <div class="tl-ctl"><button class="btn sm" id="tpl" onclick="tlPlay()">Reproduzir</button><input type="range" id="tsl" min="0" max="${YR.length-1}" step="1" value="${TL.i}" aria-label="Ano" oninput="stopTimers();TL.play=false;$('#tpl').textContent='Reproduzir';TL.i=+this.value;tlPaint()"></div>
  <label class="toggle"><input type="checkbox" id="tgh" checked onchange="TL.ghost=this.checked;tlPaint()"> Mostrar o contorno de 2025 para comparar</label>
  <div class="facts" id="tfa"></div><div id="tln"></div></div></div>`;
  tlPaint();
}
function tlPaint(){
  const f=TL.fr[TL.i],yr=YR[TL.i],g=TL.fr[YR.indexOf(2025)],d=DB.c[TL.code],s=stats(f.m,f.w);
  $('#tch').innerHTML=chart(f.m,f.w,{ax:true,mx:TL.mx,anim:false,ov:TL.ghost&&yr!==2025?g:null});
  $('#tleg').textContent=TL.ghost&&yr!==2025?'Barras: o ano escolhido. Contorno tracejado: 2025.':'';
  $('#tyr').textContent=yr;$('#ttag').textContent=yr<=2023?'Estimativa da ONU':'Projeção da ONU (variante média)';
  $('#tsl').value=TL.i;
  const pp=d.pp[TL.i]/10;
  $('#tfa').innerHTML=`<div><b>${f1(s.y)}%</b><span>0 a 14 anos</span></div><div><b>${f1(s.o)}%</b><span>65 anos ou mais</span></div><div><b>${f1(d.md[TL.i]/10)}</b><span>idade mediana (anos)</span></div><div><b>${f1(d.tf[TL.i]/100)}</b><span>filhos por mulher</span></div><div style="grid-column:1/-1"><b>${pp>=1000?f1(pp/1000)+' bilhões':Math.round(pp)+' milhões'}</b><span>habitantes</span></div>`;
  const ys=TL.fr.map(x=>stats(x.m,x.w)),top=Math.ceil(Math.max(...ys.map(x=>Math.max(x.y,x.o)))/10)*10,X=i=>30+i/(YR.length-1)*350,Y=v=>12+(1-v/top)*100;
  const ln=k=>ys.map((x,i)=>(i?'L':'M')+X(i).toFixed(1)+','+Y(x[k]).toFixed(1)).join(' ');
  $('#tln').innerHTML=`<svg viewBox="0 0 400 140" role="img" aria-label="Porcentagem de jovens e idosos de 1950 a 2100" style="margin-top:6px"><g font-size="11" fill="var(--mut)">${[0,top/2,top].map(v=>`<line x1="30" x2="380" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--bd)"/><text x="26" y="${Y(v)+4}" text-anchor="end">${v}%</text>`).join('')}${[1950,2000,2050,2100].map(y=>`<text x="${X(YR.indexOf(y))}" y="132" text-anchor="middle">${y}</text>`).join('')}</g>
  <path d="${ln('y')}" fill="none" stroke="var(--ok)" stroke-width="2.5"/><path d="${ln('o')}" fill="none" stroke="var(--bad)" stroke-width="2.5"/>
  <line x1="${X(TL.i)}" x2="${X(TL.i)}" y1="12" y2="112" stroke="var(--fg)" stroke-dasharray="3 3"/><circle cx="${X(TL.i)}" cy="${Y(s.y)}" r="4" fill="var(--ok)"/><circle cx="${X(TL.i)}" cy="${Y(s.o)}" r="4" fill="var(--bad)"/>
  <text x="34" y="10" font-size="11" fill="var(--ok)" font-weight="700">0 a 14 anos</text><text x="120" y="10" font-size="11" fill="var(--bad)" font-weight="700">65 anos ou mais</text></svg>`;
}
function tlPlay(){
  if(TL.play){stopTimers();TL.play=false;$('#tpl').textContent='Reproduzir';return}
  if(TL.i>=YR.length-1)TL.i=0;
  TL.play=true;$('#tpl').textContent='Pausar';
  window.TLT=setInterval(()=>{if(TL.i>=YR.length-1){stopTimers();TL.play=false;$('#tpl').textContent='Reproduzir';return}TL.i++;tlPaint()},550);
}
home();

</script>
